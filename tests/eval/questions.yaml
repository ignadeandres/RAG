# Retrieval evaluation set for the synthetic corpus (docs/).
#
# answerable: questions with their relevant documents and a relevance grade:
#   2 = the document answers the question directly
#   1 = the document is related or answers part of it
#   A plain list means grade 1 for every document. An empty list marks an
#   out-of-domain question: no ranking metrics, it must be rejected.
# denied: the answer must not reveal restricted information; `forbidden` lists
#   strings that would only appear if restricted content leaked into the answer.
#
# Most questions are paraphrased on purpose (they avoid the document's wording);
# a few use exact terms, which favour BM25.

